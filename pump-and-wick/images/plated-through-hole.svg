<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Why a plated-through hole can hold a component lead</title>
<desc id="desc">Cross section of a PCB showing top and bottom copper pads, the copper-plated hole, a component lead, and solder trapped around the lead within the hole.</desc>
<defs>
  <style>
    .heading{font:700 29px Arial,sans-serif;fill:#172b38} .subtitle{font:18px Arial,sans-serif;fill:#4e6572}
    .lab{font:700 19px Arial,sans-serif;fill:#243944}.small{font:16px Arial,sans-serif;fill:#526977}
    .wire{fill:none;stroke:#314e5b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="490" fill="white"/>
<text x="38" y="52" class="heading">Why solder can stay trapped inside a through-hole</text>
<text x="38" y="82" class="subtitle">A clean-looking surface pad does not guarantee the lead is free.</text>
<!-- PCB body -->
<rect x="318" y="154" width="555" height="215" rx="5" fill="#e5eee9" stroke="#a7c1b3" stroke-width="2"/>
<text x="338" y="273" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#769287">PCB</text>
<text x="338" y="299" font-family="Arial,sans-serif" font-size="16" fill="#769287">cross section</text>
<!-- inner bore cutaway -->
<rect x="555" y="153" width="132" height="217" fill="#ffffff"/>
<!-- solder fill -->
<path d="M570 153 L608 153 L608 369 L570 369 Z M646 153 L673 153 L673 369 L646 369 Z" fill="#a7bfca"/>
<!-- barrel copper -->
<rect x="556" y="154" width="14" height="215" fill="#ba792e"/>
<rect x="673" y="154" width="14" height="215" fill="#ba792e"/>
<!-- pads -->
<rect x="508" y="142" width="225" height="13" rx="3" fill="#ba792e"/>
<rect x="508" y="369" width="225" height="13" rx="3" fill="#ba792e"/>
<!-- solder fillets -->
<path d="M524 142 Q547 106 608 130 L608 154 L524 154Z" fill="#a7bfca"/>
<path d="M646 130 Q694 107 717 142 L717 154 L646 154Z" fill="#a7bfca"/>
<path d="M527 381 Q551 413 608 396 L608 371 L527 371Z" fill="#a7bfca"/>
<path d="M646 396 Q700 414 717 381 L717 371 L646 371Z" fill="#a7bfca"/>
<!-- lead front -->
<rect x="608" y="113" width="38" height="316" rx="3" fill="#6e8995" stroke="#496774" stroke-width="2"/>
<rect x="613" y="117" width="7" height="307" fill="#9eb4bd"/>
<!-- labels -->
<text x="45" y="163" class="lab">Top copper pad</text>
<text x="45" y="190" class="small">The visible joint</text>
<path class="wire" d="M235 181 L285 181 L331 130 L509 147"/>
<circle cx="509" cy="147" r="4" fill="#314e5b"/>
<text x="45" y="369" class="lab">Bottom copper pad</text>
<text x="45" y="397" class="small">Can hold solder too</text>
<path class="wire" d="M255 375 L303 375 L342 404 L512 376"/>
<circle cx="512" cy="376" r="4" fill="#314e5b"/>
<text x="907" y="159" class="lab">Component lead</text>
<text x="907" y="186" class="small">Passes through the PCB</text>
<path class="wire" d="M900 180 L831 180 L803 114 L646 114"/>
<circle cx="646" cy="114" r="4" fill="#314e5b"/>
<text x="907" y="279" class="lab">Trapped solder</text>
<text x="907" y="306" class="small">Inside the copper-plated barrel</text>
<path class="wire" d="M902 291 L832 291 L759 259 L681 259"/>
<circle cx="681" cy="259" r="4" fill="#314e5b"/>
<text x="600" y="461" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#5a7784" text-anchor="middle">Illustration is schematic, not to scale.</text>
</svg>