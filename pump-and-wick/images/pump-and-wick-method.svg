<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="410" viewBox="0 0 1500 410" role="img" aria-labelledby="title desc">
<title id="title">Two separate pump attempts with inspection and pin test between them</title>
<desc id="desc">Stage 1: flux and fresh solder. Stage 2: first desoldering pump attempt. Stage 3: inspect the hole, add flux and test whether the component pin is free. Stage 4: second pump attempt. Stage 5: finish with solder wick.</desc>
<defs>
<style>
.title{font:700 28px Arial,sans-serif;fill:#203947}
.sub{font:17px Arial,sans-serif;fill:#586c77}
.name{font:700 21px Arial,sans-serif;fill:#203947}
.detail{font:16px Arial,sans-serif;fill:#415968}
.num{font:700 19px Arial,sans-serif;fill:#fff}
.label{font:700 13px Arial,sans-serif;fill:#1f5566;letter-spacing:.4px}
.tool{stroke:#356072;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.brd{stroke:#c0d2d9;stroke-width:2}
</style>
</defs>
<rect width="1500" height="410" fill="#fff"/>
<text x="28" y="45" class="title">The two-pump desoldering sequence</text>
<text x="28" y="74" class="sub">The inspection and pin-freedom test happen between pump attempts—not after both.</text>

<g transform="translate(26,100)">
  <rect x="0" y="0" width="278" height="270" rx="12" fill="#f6f9fa" class="brd"/>
  <circle cx="28" cy="28" r="17" fill="#215b70"/><text x="28" y="35" class="num" text-anchor="middle">1</text>
  <text x="52" y="36" class="name">Refresh the joint</text>
  <text x="18" y="65" class="detail">Heat, flux, add fresh solder</text>
  <rect x="42" y="169" width="194" height="20" rx="2" fill="#bfd1c6"/>
  <rect x="128" y="120" width="21" height="100" rx="3" fill="#7796a3" stroke="#4e6b79" stroke-width="2"/>
  <path d="M95 170 Q138 127 182 170 Q186 180 174 184 H104 Q90 183 95 170" fill="#9db7c2" stroke="#658b9d" stroke-width="2"/>
  <path d="M90 120 C75 141 86 146 90 146 C102 139 97 132 90 120" fill="#d5a354"/>
  <text x="139" y="246" text-anchor="middle" class="detail">Make solder flow again</text>
</g>

<g transform="translate(319,100)">
  <rect x="0" y="0" width="278" height="270" rx="12" fill="#f6f9fa" class="brd"/>
  <circle cx="28" cy="28" r="17" fill="#215b70"/><text x="28" y="35" class="num" text-anchor="middle">2</text>
  <text x="52" y="36" class="name">First pump</text>
  <text x="18" y="65" class="detail">Remove bulk molten solder</text>
  <g transform="translate(100,112) rotate(-17 48 30)">
   <rect x="8" y="0" width="83" height="30" rx="8" fill="#e3ebee" stroke="#356072" stroke-width="4"/>
   <rect x="80" y="8" width="31" height="15" rx="4" fill="#92b1be" stroke="#356072" stroke-width="3"/>
   <path d="M25 5 V-18 M15 -18 H35" class="tool"/>
  </g>
  <path d="M140 156 L140 200 M130 173 L140 156 L150 173" class="tool" stroke-width="3"/>
  <path d="M73 217 H204" stroke="#bfd1c6" stroke-width="14" stroke-linecap="round"/>
  <text x="139" y="246" text-anchor="middle" class="detail">Pump attempt #1</text>
</g>

<g transform="translate(612,100)">
  <rect x="0" y="0" width="278" height="270" rx="12" fill="#ecf4f6" stroke="#7cabbc" stroke-width="2.5"/>
  <circle cx="28" cy="28" r="17" fill="#215b70"/><text x="28" y="35" class="num" text-anchor="middle">3</text>
  <text x="52" y="36" class="name">Inspect &amp; test</text>
  <text x="18" y="65" class="detail">Check hole; add flux again</text>
  <circle cx="139" cy="161" r="49" fill="#fff" stroke="#4b7788" stroke-width="5"/>
  <circle cx="139" cy="161" r="28" fill="#e9f1f3" stroke="#b4cbd4" stroke-width="8"/>
  <rect x="130" y="113" width="18" height="96" rx="4" fill="#7495a2" stroke="#456979" stroke-width="2"/>
  <path d="M195 141 Q215 154 195 169" class="tool" stroke-width="3"/>
  <path d="M198 158 L198 170 L210 170" class="tool" stroke-width="3"/>
  <text x="139" y="246" text-anchor="middle" class="detail">Test pin freedom gently</text>
</g>

<g transform="translate(905,100)">
  <rect x="0" y="0" width="278" height="270" rx="12" fill="#f6f9fa" class="brd"/>
  <circle cx="28" cy="28" r="17" fill="#215b70"/><text x="28" y="35" class="num" text-anchor="middle">4</text>
  <text x="52" y="36" class="name">Second pump</text>
  <text x="18" y="65" class="detail">Extract stubborn solder</text>
  <g transform="translate(100,112) rotate(-17 48 30)">
   <rect x="8" y="0" width="83" height="30" rx="8" fill="#e3ebee" stroke="#356072" stroke-width="4"/>
   <rect x="80" y="8" width="31" height="15" rx="4" fill="#92b1be" stroke="#356072" stroke-width="3"/>
   <path d="M25 5 V-18 M15 -18 H35" class="tool"/>
  </g>
  <path d="M140 156 L140 200 M130 173 L140 156 L150 173" class="tool" stroke-width="3"/>
  <path d="M73 217 H204" stroke="#bfd1c6" stroke-width="14" stroke-linecap="round"/>
  <text x="139" y="246" text-anchor="middle" class="detail">Pump attempt #2</text>
</g>

<g transform="translate(1198,100)">
  <rect x="0" y="0" width="278" height="270" rx="12" fill="#f6f9fa" class="brd"/>
  <circle cx="28" cy="28" r="17" fill="#215b70"/><text x="28" y="35" class="num" text-anchor="middle">5</text>
  <text x="52" y="36" class="name">Finish with wick</text>
  <text x="18" y="65" class="detail">Clean small solder residue</text>
  <path d="M52 202 L215 202" stroke="#bfd1c6" stroke-width="16" stroke-linecap="round"/>
  <path d="M55 167 Q106 158 143 167 T224 167" fill="none" stroke="#d1a758" stroke-width="12" stroke-linecap="round"/>
  <path d="M75 130 L146 180" class="tool" stroke-width="12"/>
  <path d="M139 175 L149 184" stroke="#c3c9cc" stroke-width="11" stroke-linecap="round"/>
  <text x="139" y="246" text-anchor="middle" class="detail">Verify, then gently remove</text>
</g>
</svg>
