<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1450 470" width="1450" height="470" role="img" aria-labelledby="title desc">
<title id="title">Cross sections of a solder-blocked plated through-hole before, during, and after using a stainless steel needle</title>
<desc id="desc">Three side-by-side states: a copper plated PCB hole filled with solid solder, a needle passing through solder inside the hole, and an open passage after withdrawing the needle.</desc>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937} .head{font-size:25px;font-weight:700}.sub{font-size:18px}.legend{font-size:16px}.number{font-size:15px;font-weight:bold;fill:white}
  .line{stroke:#374151;stroke-width:2.5;stroke-linejoin:round}.board{fill:#387b5b;stroke:#285a40;stroke-width:2}.copper{fill:#ce8c49;stroke:#a66a37;stroke-width:1}.solder{fill:#b4c0ca;stroke:#657688;stroke-width:2}.needle{fill:#e8eff5;stroke:#465361;stroke-width:2}.white{fill:#fff}
</style>
<rect width="1450" height="470" fill="white"/>
<text class="head" x="725" y="36" text-anchor="middle">Why the needle leaves an open hole</text>

<!-- Panel 1 -->
<g transform="translate(50,0)">
 <circle cx="23" cy="82" r="18" fill="#1f2937"/><text class="number" x="23" y="87" text-anchor="middle">1</text>
 <text class="sub" x="52" y="89" font-weight="bold">Blocked hole</text>
 <rect class="board" x="0" y="184" width="395" height="135" rx="6"/>
 <rect class="white" x="166" y="179" width="63" height="146"/>
 <rect class="copper" x="157" y="168" width="81" height="14" rx="3"/>
 <rect class="copper" x="157" y="321" width="81" height="14" rx="3"/>
 <rect class="copper" x="157" y="180" width="12" height="141"/>
 <rect class="copper" x="226" y="180" width="12" height="141"/>
 <rect class="solder" x="169" y="165" width="57" height="172" rx="9"/>
 <text class="legend" x="198" y="371" text-anchor="middle">Solder fills the barrel</text>
 <path d="M198 342 V350" stroke="#1f2937" stroke-width="2"/>
</g>

<!-- arrow -->
<path d="M464 255 h36 l-10 -10 m10 10 l-10 10" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- Panel 2 -->
<g transform="translate(528,0)">
 <circle cx="23" cy="82" r="18" fill="#1f2937"/><text class="number" x="23" y="87" text-anchor="middle">2</text>
 <text class="sub" x="52" y="89" font-weight="bold">Needle holds the center open</text>
 <rect class="board" x="0" y="184" width="395" height="135" rx="6"/>
 <rect class="white" x="166" y="179" width="63" height="146"/>
 <rect class="copper" x="157" y="168" width="81" height="14" rx="3"/>
 <rect class="copper" x="157" y="321" width="81" height="14" rx="3"/>
 <rect class="copper" x="157" y="180" width="12" height="141"/>
 <rect class="copper" x="226" y="180" width="12" height="141"/>
 <rect class="solder" x="169" y="165" width="57" height="172" rx="9"/>
 <rect class="needle" x="185" y="119" width="25" height="229" rx="7"/>
 <path class="needle" d="M185 345 L197.5 373 L210 345Z"/>
 <text class="legend" x="198" y="400" text-anchor="middle">Cool with the needle inside</text>
</g>

<!-- arrow -->
<path d="M945 255 h36 l-10 -10 m10 10 l-10 10" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- Panel 3 -->
<g transform="translate(1004,0)">
 <circle cx="23" cy="82" r="18" fill="#1f2937"/><text class="number" x="23" y="87" text-anchor="middle">3</text>
 <text class="sub" x="52" y="89" font-weight="bold">Needle slides out</text>
 <rect class="board" x="0" y="184" width="395" height="135" rx="6"/>
 <rect class="white" x="166" y="179" width="63" height="146"/>
 <rect class="copper" x="157" y="168" width="81" height="14" rx="3"/>
 <rect class="copper" x="157" y="321" width="81" height="14" rx="3"/>
 <rect class="copper" x="157" y="180" width="12" height="141"/>
 <rect class="copper" x="226" y="180" width="12" height="141"/>
 <path d="M169 169 Q198 158 226 169 L226 331 Q198 338 169 331Z" fill="#bbc5cd" stroke="#657688" stroke-width="2"/>
 <rect class="white" x="185" y="165" width="25" height="173" rx="9"/>
 <rect class="needle" x="186" y="96" width="23" height="60" rx="6"/>
 <path d="M197.5 170 V159 M190 165 l7.5 -9 7.5 9" fill="none" stroke="#374151" stroke-width="2.5"/>
 <text class="legend" x="198" y="374" text-anchor="middle">Open central passage</text>
</g>

<g transform="translate(446 437)">
 <rect x="0" y="0" width="25" height="14" fill="#387b5b"/><text class="legend" x="33" y="13">PCB</text>
 <rect x="145" y="0" width="25" height="14" fill="#ce8c49"/><text class="legend" x="178" y="13">Copper plating</text>
 <rect x="350" y="0" width="25" height="14" fill="#b4c0ca"/><text class="legend" x="383" y="13">Solder</text>
 <rect x="492" y="0" width="25" height="14" fill="#e8eff5" stroke="#465361"/><text class="legend" x="525" y="13">Needle</text>
</g>
</svg>