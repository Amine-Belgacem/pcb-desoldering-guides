<rect x="288" y="290" width="32" height="8" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="240" y="193" width="48" height="106" rx="4" fill="#b7c1ca" stroke="none" stroke-width="2"/>
<rect x="254" y="133" width="20" height="190" rx="7" fill="#35556d" stroke="none" stroke-width="2"/>
<rect x="257" y="139" width="3" height="175" rx="1" fill="#87a4b6" stroke="none" stroke-width="2"/>
<circle cx="391" cy="237" r="27" fill="white" stroke="#536674" stroke-width="2"/>
<path d="M391 219 V238 L404 246" fill="none" stroke="#536674" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Keep the needle in place during cooling.</text>
</g>
<g transform="translate(568 540)">
<rect x="0" y="0" width="528" height="382" rx="14" fill="#f6f8f9" stroke="#dce4e8" stroke-width="2"/>
<rect x="22" y="18" width="35" height="35" rx="10" fill="#24745d" stroke="none" stroke-width="2"/>
