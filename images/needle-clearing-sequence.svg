<text x="72" y="44" font-size="25" font-weight="700" fill="#183346" text-anchor="start">Insert while molten</text>
<text x="24" y="82" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Slide a smooth needle straight through.</text>
