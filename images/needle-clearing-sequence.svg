<text x="72" y="44" font-size="25" font-weight="700" fill="#183346" text-anchor="start">Withdraw, then inspect</text>
<text x="24" y="82" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Pull straight out after solidification.</text>
<rect x="52" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<rect x="296" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
