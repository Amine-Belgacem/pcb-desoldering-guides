<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Lead fits freely; copper stays intact.</text>
</g>
<rect x="32" y="953" width="26" height="19" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<text x="70" y="969" font-size="21" font-weight="400" fill="#536674" text-anchor="start">PCB</text>
<rect x="210" y="953" width="26" height="19" rx="3" fill="#d48545" stroke="none" stroke-width="2"/>
<text x="248" y="969" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Copper</text>
