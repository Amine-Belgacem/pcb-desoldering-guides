<text x="476" y="969" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Solder</text>
<rect x="665" y="953" width="26" height="19" rx="3" fill="#35556d" stroke="none" stroke-width="2"/>
<text x="703" y="969" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Lead / needle</text>
<text x="32" y="1012" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Schematic cross-sections. Grey solder remains on the barrel around the new central passage.</text>
</g></svg>
