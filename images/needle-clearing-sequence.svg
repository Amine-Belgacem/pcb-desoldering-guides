<rect x="208" y="290" width="32" height="8" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="288" y="194" width="32" height="8" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="288" y="290" width="32" height="8" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="240" y="193" width="48" height="106" rx="4" fill="#b7c1ca" stroke="none" stroke-width="2"/>
<rect x="254" y="133" width="20" height="190" rx="7" fill="#35556d" stroke="none" stroke-width="2"/>
<rect x="257" y="139" width="3" height="175" rx="1" fill="#87a4b6" stroke="none" stroke-width="2"/>
<path d="M186 184 Q179 173 186 163 Q193 153 186 143" fill="none" stroke="#bf4b3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M322 184 Q315 173 322 163 Q329 153 322 143" fill="none" stroke="#bf4b3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M405 124 L305 177" fill="none" stroke="#183346" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
<path d="M305 177 L285 192" fill="none" stroke="#728795" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
<path d="M287 192 L281 196" fill="none" stroke="#b7c1ca" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
<path d="M308 133 L308 177" fill="none" stroke="#35556d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Keep the solder liquid; do not force it.</text>
</g>
<g transform="translate(24 540)">
<rect x="0" y="0" width="528" height="382" rx="14" fill="#eff7f3" stroke="#aecdbf" stroke-width="2"/>
<rect x="22" y="18" width="35" height="35" rx="10" fill="#24745d" stroke="none" stroke-width="2"/>
<text x="39.5" y="43" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="72" y="44" font-size="25" font-weight="700" fill="#183346" text-anchor="start">Let the solder harden</text>
<text x="24" y="82" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Remove the iron; hold the needle still.</text>
<rect x="52" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<rect x="296" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
