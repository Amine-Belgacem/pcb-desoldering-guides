<text x="823" y="207" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Runs through the joint</text>
<path d="M811 188 H720 L672 177 H563" fill="none" stroke="#536674" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="563" cy="177" r="4" fill="#183346"/>
<text x="823" y="286" font-size="23" font-weight="700" fill="#183346" text-anchor="start">Solder</text>
<text x="823" y="315" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Can bond lead to barrel</text>
<path d="M811 297 H705 L648 316 H575" fill="none" stroke="#536674" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="575" cy="316" r="4" fill="#183346"/>
<text x="823" y="399" font-size="23" font-weight="700" fill="#183346" text-anchor="start">Copper barrel</text>
<text x="823" y="428" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Thin plating inside the hole</text>
<path d="M811 410 H728 L662 366 H590" fill="none" stroke="#536674" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="590" cy="366" r="4" fill="#183346"/>
<rect x="32" y="535" width="26" height="19" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<text x="70" y="551" font-size="21" font-weight="400" fill="#536674" text-anchor="start">PCB</text>
<rect x="210" y="535" width="26" height="19" rx="3" fill="#d48545" stroke="none" stroke-width="2"/>
<text x="248" y="551" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Copper</text>
<rect x="438" y="535" width="26" height="19" rx="3" fill="#b7c1ca" stroke="none" stroke-width="2"/>
<text x="476" y="551" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Solder</text>
<rect x="665" y="535" width="26" height="19" rx="3" fill="#35556d" stroke="none" stroke-width="2"/>
<text x="703" y="551" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Lead / needle</text>
<text x="32" y="601" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Cross-section, not to scale. Internal copper layers are omitted for clarity.</text>
</g></svg>
