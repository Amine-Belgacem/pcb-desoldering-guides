<rect x="586" y="240" width="8" height="160" rx="0" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="482" y="230" width="42" height="10" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="482" y="400" width="42" height="10" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="586" y="230" width="42" height="10" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="586" y="400" width="42" height="10" rx="1" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="524" y="238" width="23" height="164" rx="0" fill="#b7c1ca" stroke="none" stroke-width="2"/>
<rect x="563" y="238" width="23" height="164" rx="0" fill="#b7c1ca" stroke="none" stroke-width="2"/>
<path d="M492 230 Q516 210 547 218 L547 240 H492Z" fill="#b7c1ca" stroke="#b7c1ca" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" />
<path d="M563 218 Q598 210 618 230 V240 H563Z" fill="#b7c1ca" stroke="#b7c1ca" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" />
<path d="M492 410 Q516 430 547 422 V400 H492Z" fill="#b7c1ca" stroke="#b7c1ca" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" />
<path d="M563 422 Q598 430 618 410 V400 H563Z" fill="#b7c1ca" stroke="#b7c1ca" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" />
<rect x="547" y="173" width="16" height="298" rx="2" fill="#35556d" stroke="none" stroke-width="2"/>
<text x="371" y="318" font-size="28" font-weight="700" fill="#3c7660" text-anchor="start">PCB</text>
<text x="371" y="348" font-size="20" font-weight="400" fill="#3c7660" text-anchor="start">substrate</text>
<text x="32" y="181" font-size="23" font-weight="700" fill="#183346" text-anchor="start">Surface pad</text>
<text x="32" y="210" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Copper on the top face</text>
<path d="M272 188 H310 L347 213 L484 235" fill="none" stroke="#536674" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="484" cy="235" r="4" fill="#183346"/>
<text x="32" y="440" font-size="23" font-weight="700" fill="#183346" text-anchor="start">Opposite pad</text>
<text x="32" y="469" font-size="20" font-weight="400" fill="#536674" text-anchor="start">Solder may remain here too</text>
<path d="M284 450 H322 L359 435 L484 405" fill="none" stroke="#536674" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="484" cy="405" r="4" fill="#183346"/>
