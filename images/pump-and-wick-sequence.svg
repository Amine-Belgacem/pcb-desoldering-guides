<path d="M337 219 L337 155" fill="none" stroke="#35556d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="354" y="191" font-size="18" font-weight="400" fill="#536674" text-anchor="start">Suction</text>
<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Move from iron to pump promptly.</text>
</g>
