<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1440" viewBox="0 0 1120 1440" role="img" aria-labelledby="title desc">
<title id="title">Two-pump component removal sequence</title>
<desc id="desc">Six panels preserve the order: refresh the joint, first pump, inspect and add flux and test pin freedom, second pump if still bonded, wick residue, verify every lead then remove and clean.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35556d"/></marker>
 <pattern id="braid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9aa6d"/><path d="M-3 0 L9 12 M3 0 L15 12 M-3 12 L9 0 M3 12 L15 0" stroke="#9b6633" stroke-width="1.4"/></pattern>
</defs>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1120" height="1440" rx="0" fill="white" stroke="none" stroke-width="2"/>
<text x="32" y="34" font-size="16" font-weight="700" fill="#24745d" text-anchor="start">PCB DESOLDERING / COMPONENT REMOVAL</text>
<text x="32" y="78" font-size="32" font-weight="700" fill="#183346" text-anchor="start">Pump first, inspect, then finish with wick</text>
<text x="32" y="111" font-size="22" font-weight="400" fill="#536674" text-anchor="start">Read each row left to right. The pin test comes between the two pump attempts.</text>
<g transform="translate(24 138)">
<rect x="0" y="0" width="528" height="382" rx="14" fill="#f6f8f9" stroke="#dce4e8" stroke-width="2"/>
<rect x="22" y="18" width="35" height="35" rx="10" fill="#24745d" stroke="none" stroke-width="2"/>
<text x="39.5" y="43" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="72" y="44" font-size="25" font-weight="700" fill="#183346" text-anchor="start">Refresh the joint</text>
<text x="24" y="82" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Secure → heat → flux → fresh solder.</text>
<rect x="52" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<rect x="296" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<rect x="232" y="202" width="8" height="88" rx="0" fill="#d48545" stroke="none" stroke-width="2"/>
<rect x="288" y="202" width="8" height="88" rx="0" fill="#d48545" stroke="none" stroke-width="2"/>
