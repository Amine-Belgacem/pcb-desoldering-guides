<path d="M280 142 L309 142" fill="none" stroke="#35556d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Check movement while solder is molten.</text>
</g>
<g transform="translate(568 540)">
<rect x="0" y="0" width="528" height="382" rx="14" fill="#f6f8f9" stroke="#dce4e8" stroke-width="2"/>
