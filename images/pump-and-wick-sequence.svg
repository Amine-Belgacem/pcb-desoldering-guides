<rect x="235" y="124" width="58" height="46" rx="8" fill="#e6edf1" stroke="#35556d" stroke-width="3"/>
<path d="M235 164 L248 193 H280 L293 164" fill="#e6edf1" stroke="#35556d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M264 124 V110 M249 110 H279" fill="none" stroke="#35556d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M337 219 L337 155" fill="none" stroke="#35556d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="354" y="191" font-size="18" font-weight="400" fill="#536674" text-anchor="start">Suction</text>
<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Avoid more heating if the lead is free.</text>
</g>
<g transform="translate(24 942)">
<rect x="0" y="0" width="528" height="382" rx="14" fill="#f6f8f9" stroke="#dce4e8" stroke-width="2"/>
<rect x="22" y="18" width="35" height="35" rx="10" fill="#24745d" stroke="none" stroke-width="2"/>
<text x="39.5" y="43" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text>
<text x="72" y="44" font-size="25" font-weight="700" fill="#183346" text-anchor="start">Finish with wick</text>
<text x="24" y="82" font-size="21" font-weight="400" fill="#536674" text-anchor="start">Use fresh braid on small deposits.</text>
<rect x="52" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
<rect x="296" y="202" width="180" height="88" rx="3" fill="#c9e2d7" stroke="none" stroke-width="2"/>
