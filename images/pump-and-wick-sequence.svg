<path d="M114 131 Q169 139 219 189" fill="none" stroke="#8297a4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="264" y="362" font-size="20" font-weight="400" fill="#183346" text-anchor="middle">Reflow the pad and lead together.</text>
</g>
<g transform="translate(568 138)">
<rect x="0" y="0" width="528" height="382" rx="14" fill="#f6f8f9" stroke="#dce4e8" stroke-width="2"/>
